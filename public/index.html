<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stock Evaluator - LLM Powered Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .risk-low { border-left-color: #10b981; }
        .risk-medium { border-left-color: #f59e0b; }
        .risk-high { border-left-color: #ef4444; }
        .recommendation-buy { background-color: #dcfce7; color: #166534; }
        .recommendation-hold { background-color: #fef3c7; color: #92400e; }
        .recommendation-sell { background-color: #fee2e2; color: #991b1b; }
        
        /* Fix for hidden class */
        .hidden { display: none; }
        
        /* Loading animation */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        
        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="gradient-bg text-white shadow-lg">
        <div class="container mx-auto px-4 py-8">
            <div class="text-center">
                <h1 class="text-4xl font-bold mb-2">
                    <i class="fas fa-chart-line mr-3"></i>
                    AI Stock Evaluator
                </h1>
                <p class="text-xl opacity-90">LLM-Powered Financial Analysis & Investment Insights</p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Input Section -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">
                    <i class="fas fa-search-dollar mr-2"></i>
                    Stock Analysis
                </h2>
                <div class="flex gap-2">
                    <button type="button" id="loadSample" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">
                        <i class="fas fa-magic mr-2"></i>Load Sample Data
                    </button>
                    <button type="button" id="loadJson" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition">
                        <i class="fas fa-database mr-2"></i>Load from JSON
                    </button>
                </div>
            </div>

            <form id="stockForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Stock Symbol Selection -->
                <div class="md:col-span-2 lg:col-span-3">
                    <label for="stockSymbol" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-tag mr-2"></i>Select Stock Symbol
                    </label>
                    <select id="stockSymbol" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                        <option value="">Select a stock...</option>
                    </select>
                </div>

                <!-- Financial Metrics -->
                <div>
                    <label for="peRatio" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-chart-bar mr-2"></i>P/E Ratio
                    </label>
                    <input type="number" id="peRatio" step="0.1" min="0"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required readonly>
                </div>

                <div>
                    <label for="eps" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-coins mr-2"></i>EPS ($)
                    </label>
                    <input type="number" id="eps" step="0.1" min="0"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required readonly>
                </div>

                <div>
                    <label for="dividendYield" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-percentage mr-2"></i>Dividend Yield (%)
                    </label>
                    <input type="number" id="dividendYield" step="0.01" min="0" max="100"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required readonly>
                </div>

                <div>
                    <label for="marketCap" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-building mr-2"></i>Market Cap (Billions)
                    </label>
                    <input type="number" id="marketCap" min="0"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required readonly>
                </div>

                <div>
                    <label for="debtEquity" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-balance-scale mr-2"></i>Debt/Equity Ratio
                    </label>
                    <input type="number" id="debtEquity" step="0.1" min="0"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required readonly>
                </div>

                <div>
                    <label for="roe" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-arrow-up mr-2"></i>ROE (%)
                    </label>
                    <input type="number" id="roe" step="0.1" min="0" max="100"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required readonly>
                </div>

                <div>
                    <label for="roa" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-arrow-up mr-2"></i>ROA (%)
                    </label>
                    <input type="number" id="roa" step="0.1" min="0" max="100"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required readonly>
                </div>

                <div>
                    <label for="currentRatio" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-exchange-alt mr-2"></i>Current Ratio
                    </label>
                    <input type="number" id="currentRatio" step="0.1" min="0"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required readonly>
                </div>

                <div>
                    <label for="quickRatio" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-bolt mr-2"></i>Quick Ratio
                    </label>
                    <input type="number" id="quickRatio" step="0.1" min="0"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required readonly>
                </div>

                <div>
                    <label for="bookValue" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-book mr-2"></i>Book Value/Share ($)
                    </label>
                    <input type="number" id="bookValue" step="0.1" min="0"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required readonly>
                </div>

                <div class="md:col-span-2 lg:col-span-3">
                    <button type="submit" id="analyzeBtn" 
                            class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-4 px-6 rounded-lg font-semibold text-lg hover:from-blue-700 hover:to-purple-700 transition shadow-lg">
                        <i class="fas fa-brain mr-2"></i>Analyze with AI
                    </button>
                </div>
            </form>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-16 w-16 border-b-2 border-blue-600"></div>
            <p class="mt-4 text-gray-600 text-lg">
                <i class="fas fa-robot mr-2"></i>AI is analyzing financial metrics...
            </p>
        </div>

        <!-- Results Section -->
        <div id="results" class="hidden">
            <!-- Results will be populated here -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-8 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2024 AI Stock Evaluator. Powered by Advanced LLM Technology.</p>
            <p class="text-gray-400 text-sm mt-2">Professional financial analysis powered by artificial intelligence</p>
        </div>
    </footer>

        document.addEventListener('DOMContentLoaded', function() {
            const stockForm = document.getElementById('stockForm');
            const loadingDiv = document.getElementById('loading');
            const resultsDiv = document.getElementById('results');
            const analyzeBtn = document.getElementById('analyzeBtn');
            const loadSampleBtn = document.getElementById('loadSample');
            const loadJsonBtn = document.getElementById('loadJson');
            const stockSymbolSelect = document.getElementById('stockSymbol');

            // Populate the stock symbol dropdown
            function populateStockDropdown() {
                stockSymbolSelect.innerHTML = '<option value="">Select a stock...</option>';
                stockData.forEach(stock => {
                    const option = document.createElement('option');
                    option.value = stock.stockSymbol;
                    option.textContent = stock.stockSymbol;
                    stockSymbolSelect.appendChild(option);
                });
            }

            // Load stock data when a symbol is selected
            stockSymbolSelect.addEventListener('change', function() {
                const selectedSymbol = this.value;
                if (selectedSymbol) {
                    const stock = stockData.find(s => s.stockSymbol === selectedSymbol);
                    if (stock) {
                        document.getElementById('peRatio').value = stock.parameters.priceEarningsRatio;
                        document.getElementById('eps').value = stock.parameters.earningsPerShare;
                        document.getElementById('dividendYield').value = stock.parameters.dividendYield;
                        document.getElementById('marketCap').value = (stock.parameters.marketCap / 1e9).toFixed(2);
                        document.getElementById('debtEquity').value = stock.parameters.debtToEquityRatio;
                        document.getElementById('roe').value = (stock.parameters.returnOnEquity * 100).toFixed(2);
                        document.getElementById('roa').value = (stock.parameters.returnOnAssets * 100).toFixed(2);
                        document.getElementById('currentRatio').value = stock.parameters.currentRatio;
                        document.getElementById('quickRatio').value = stock.parameters.quickRatio;
                        document.getElementById('bookValue').value = stock.parameters.bookValuePerShare;
                    }
                }
            });

            // Handle form submission
            stockForm.addEventListener('submit', function(e) {
                e.preventDefault();
                analyzeStock();
            });

            // Load sample data
            loadSampleBtn.addEventListener('click', function() {
                // Select a random stock from the data
                const randomIndex = Math.floor(Math.random() * stockData.length);
                const randomStock = stockData[randomIndex];
                
                stockSymbolSelect.value = randomStock.stockSymbol;
                
                // Trigger the change event to populate the form
                const event = new Event('change');
                stockSymbolSelect.dispatchEvent(event);
                
                showMessage(`Loaded data for ${randomStock.stockSymbol}`, 'success');
            });

            // Load from JSON button
            loadJsonBtn.addEventListener('click', function() {
                populateStockDropdown();
                showMessage('Stock data loaded from JSON! Select a stock symbol to analyze.', 'success');
            });

            function analyzeStock() {
                // Show loading
                loadingDiv.classList.remove('hidden');
                resultsDiv.classList.add('hidden');
                analyzeBtn.disabled = true;
                analyzeBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Analyzing...';

                // Get form data
                const stockDataObj = {
                    stockSymbol: document.getElementById('stockSymbol').value,
                    parameters: {
                        priceEarningsRatio: parseFloat(document.getElementById('peRatio').value),
                        earningsPerShare: parseFloat(document.getElementById('eps').value),
                        dividendYield: parseFloat(document.getElementById('dividendYield').value),
                        marketCap: parseFloat(document.getElementById('marketCap').value) * 1e9,
                        debtToEquityRatio: parseFloat(document.getElementById('debtEquity').value),
                        returnOnEquity: parseFloat(document.getElementById('roe').value) / 100,
                        returnOnAssets: parseFloat(document.getElementById('roa').value) / 100,
                        currentRatio: parseFloat(document.getElementById('currentRatio').value),
                        quickRatio: parseFloat(document.getElementById('quickRatio').value),
                        bookValuePerShare: parseFloat(document.getElementById('bookValue').value)
                    }
                };

                // Simulate API call (replace with actual API call)
                setTimeout(() => {
                    // Hide loading
                    loadingDiv.classList.add('hidden');
                    analyzeBtn.disabled = false;
                    analyzeBtn.innerHTML = '<i class="fas fa-brain mr-2"></i>Analyze with AI';

                    // Display results
                    displayResults(stockDataObj);
                }, 2000);
            }

            function displayResults(stockData) {
                const { stockSymbol, parameters } = stockData;
                
                // AI Analysis Logic
                const analysis = performAIAnalysis(parameters);
                
                const riskClass = `risk-${analysis.riskLevel.toLowerCase()}`;
                const recommendationClass = `recommendation-${analysis.recommendation.toLowerCase()}`;
                
                resultsDiv.innerHTML = `
                    <div class="bg-white rounded-lg shadow-lg p-6">
                        <!-- Header -->
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 pb-4 border-b">
                            <div>
                                <h2 class="text-3xl font-bold text-gray-800">
                                    <i class="fas fa-chart-line mr-2"></i>${stockSymbol}
                                </h2>
                                <p class="text-gray-600">AI Analysis Results</p>
                            </div>
                            <div class="flex gap-4 mt-4 md:mt-0">
                                <span class="${recommendationClass} px-4 py-2 rounded-full font-semibold text-sm">
                                    <i class="fas fa-bullhorn mr-1"></i>${analysis.recommendation}
                                </span>
                                <span class="border-l-4 ${riskClass} px-4 py-2 bg-gray-50 rounded">
                                    <i class="fas fa-shield-alt mr-1"></i>Risk: ${analysis.riskLevel}
                                </span>
                                <span class="px-4 py-2 bg-blue-50 text-blue-700 rounded font-semibold">
                                    <i class="fas fa-star mr-1"></i>Confidence: ${analysis.confidenceScore}%
                                </span>
                            </div>
                        </div>

                        <!-- Summary -->
                        <div class="mb-8 p-4 bg-gradient-to-r from-blue-50 to-purple-50 rounded-lg border">
                            <h3 class="font-semibold text-lg mb-2 text-gray-800">
                                <i class="fas fa-file-alt mr-2"></i>Executive Summary
                            </h3>
                            <p class="text-gray-700 leading-relaxed">${analysis.summary}</p>
                        </div>

                        <!-- Detailed Analysis -->
                        <h3 class="text-xl font-semibold mb-4 text-gray-800">
                            <i class="fas fa-search mr-2"></i>Detailed Analysis
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${Object.entries(analysis.feedback).map(([metric, analysisText]) => `
                                <div class="p-4 bg-gray-50 rounded-lg border hover:shadow-md transition">
                                    <div class="flex items-center mb-2">
                                        <i class="fas fa-${getMetricIcon(metric)} text-blue-500 mr-2"></i>
                                        <h4 class="font-semibold text-gray-700 capitalize">${formatMetricName(metric)}</h4>
                                    </div>
                                    <p class="text-gray-600 text-sm">${analysisText}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                
                resultsDiv.classList.remove('hidden');
                resultsDiv.scrollIntoView({ behavior: 'smooth' });
            }

            function performAIAnalysis(parameters) {
                // AI Analysis Logic
                let riskScore = 0;
                let recommendationScore = 0;
                
                // P/E Ratio Analysis
                let peAnalysis = '';
                if (parameters.priceEarningsRatio < 15) {
                    peAnalysis = `The P/E ratio of ${parameters.priceEarningsRatio} is low, suggesting potential undervaluation.`;
                    recommendationScore += 2;
                } else if (parameters.priceEarningsRatio < 25) {
                    peAnalysis = `The P/E ratio of ${parameters.priceEarningsRatio} is reasonable compared to industry averages.`;
                    recommendationScore += 1;
                } else {
                    peAnalysis = `The P/E ratio of ${parameters.priceEarningsRatio} is high, indicating potential overvaluation.`;
                    riskScore += 1;
                }
                
                // EPS Analysis
                let epsAnalysis = '';
                if (parameters.earningsPerShare > 5) {
                    epsAnalysis = `Strong EPS of $${parameters.earningsPerShare} indicates healthy profitability.`;
                    recommendationScore += 2;
                } else if (parameters.earningsPerShare > 2) {
                    epsAnalysis = `Moderate EPS of $${parameters.earningsPerShare} shows reasonable profitability.`;
                    recommendationScore += 1;
                } else {
                    epsAnalysis = `Low EPS of $${parameters.earningsPerShare} may indicate profitability challenges.`;
                    riskScore += 1;
                }
                
                // Dividend Yield Analysis
                let dividendAnalysis = '';
                if (parameters.dividendYield > 3) {
                    dividendAnalysis = `High dividend yield of ${parameters.dividendYield}% provides attractive income.`;
                    recommendationScore += 1;
                } else if (parameters.dividendYield > 1) {
                    dividendAnalysis = `Modest dividend yield of ${parameters.dividendYield}% offers some income.`;
                } else {
                    dividendAnalysis = `Low or no dividend yield of ${parameters.dividendYield}% focuses on growth rather than income.`;
                }
                
                // Market Cap Analysis
                let marketCapAnalysis = '';
                const marketCapInBillions = parameters.marketCap / 1e9;
                if (marketCapInBillions > 200) {
                    marketCapAnalysis = `Large-cap company with $${marketCapInBillions.toFixed(0)}B market cap offers stability.`;
                    recommendationScore += 1;
                } else if (marketCapInBillions > 10) {
                    marketCapAnalysis = `Mid-cap company with $${marketCapInBillions.toFixed(0)}B market cap offers growth potential.`;
                } else {
                    marketCapAnalysis = `Small-cap company with $${marketCapInBillions.toFixed(0)}B market cap carries higher risk.`;
                    riskScore += 1;
                }
                
                // Debt/Equity Analysis
                let debtAnalysis = '';
                if (parameters.debtToEquityRatio < 0.5) {
                    debtAnalysis = `Low debt-to-equity ratio of ${parameters.debtToEquityRatio} indicates conservative financing.`;
                    recommendationScore += 2;
                } else if (parameters.debtToEquityRatio < 1) {
                    debtAnalysis = `Moderate debt-to-equity ratio of ${parameters.debtToEquityRatio} shows balanced leverage.`;
                    recommendationScore += 1;
                } else {
                    debtAnalysis = `High debt-to-equity ratio of ${parameters.debtToEquityRatio} may increase financial risk.`;
                    riskScore += 2;
                }
                
                // ROE Analysis
                let roeAnalysis = '';
                const roePercent = parameters.returnOnEquity * 100;
                if (roePercent > 15) {
                    roeAnalysis = `Strong ROE of ${roePercent.toFixed(1)}% indicates efficient use of equity.`;
                    recommendationScore += 2;
                } else if (roePercent > 8) {
                    roeAnalysis = `Reasonable ROE of ${roePercent.toFixed(1)}% shows adequate equity utilization.`;
                    recommendationScore += 1;
                } else {
                    roeAnalysis = `Low ROE of ${roePercent.toFixed(1)}% may indicate inefficiency in using equity.`;
                    riskScore += 1;
                }
                
                // ROA Analysis
                let roaAnalysis = '';
                const roaPercent = parameters.returnOnAssets * 100;
                if (roaPercent > 10) {
                    roaAnalysis = `Strong ROA of ${roaPercent.toFixed(1)}% indicates efficient asset utilization.`;
                    recommendationScore += 1;
                } else if (roaPercent > 5) {
                    roaAnalysis = `Reasonable ROA of ${roaPercent.toFixed(1)}% shows adequate asset management.`;
                } else {
                    roaAnalysis = `Low ROA of ${roaPercent.toFixed(1)}% may indicate poor asset utilization.`;
                    riskScore += 1;
                }
                
                // Current Ratio Analysis
                let currentRatioAnalysis = '';
                if (parameters.currentRatio > 2) {
                    currentRatioAnalysis = `Strong current ratio of ${parameters.currentRatio} indicates good short-term liquidity.`;
                    recommendationScore += 1;
                } else if (parameters.currentRatio > 1) {
                    currentRatioAnalysis = `Adequate current ratio of ${parameters.currentRatio} shows reasonable liquidity.`;
                } else {
                    currentRatioAnalysis = `Low current ratio of ${parameters.currentRatio} may indicate liquidity concerns.`;
                    riskScore += 2;
                }
                
                // Quick Ratio Analysis
                let quickRatioAnalysis = '';
                if (parameters.quickRatio > 1.5) {
                    quickRatioAnalysis = `Strong quick ratio of ${parameters.quickRatio} indicates good immediate liquidity.`;
                    recommendationScore += 1;
                } else if (parameters.quickRatio > 1) {
                    quickRatioAnalysis = `Adequate quick ratio of ${parameters.quickRatio} shows reasonable immediate liquidity.`;
                } else {
                    quickRatioAnalysis = `Low quick ratio of ${parameters.quickRatio} may indicate immediate liquidity concerns.`;
                    riskScore += 1;
                }
                
                // Book Value Analysis
                let bookValueAnalysis = '';
                if (parameters.bookValuePerShare > 20) {
                    bookValueAnalysis = `High book value of $${parameters.bookValuePerShare} per share provides strong asset backing.`;
                    recommendationScore += 1;
                } else if (parameters.bookValuePerShare > 5) {
                    bookValueAnalysis = `Reasonable book value of $${parameters.bookValuePerShare} per share provides adequate asset backing.`;
                } else {
                    bookValueAnalysis = `Low book value of $${parameters.bookValuePerShare} per share may indicate weak asset backing.`;
                    riskScore += 1;
                }
                
                // Determine Recommendation
                let recommendation = 'HOLD';
                if (recommendationScore >= 12) {
                    recommendation = 'BUY';
                } else if (recommendationScore <= 6) {
                    recommendation = 'SELL';
                }
                
                // Determine Risk Level
                let riskLevel = 'MEDIUM';
                if (riskScore <= 3) {
                    riskLevel = 'LOW';
                } else if (riskScore >= 7) {
                    riskLevel = 'HIGH';
                }
                
                // Calculate Confidence Score
                const confidenceScore = Math.min(95, Math.max(65, 80 + (recommendationScore - riskScore)));
                
                // Generate Summary
                const summary = `Based on our analysis, this stock demonstrates ${riskLevel.toLowerCase()} risk characteristics with ${recommendationScore >= 10 ? 'strong' : recommendationScore >= 7 ? 'moderate' : 'weak'} fundamentals. The ${recommendation} recommendation reflects ${recommendation === 'BUY' ? 'favorable' : recommendation === 'SELL' ? 'unfavorable' : 'neutral'} valuation metrics and financial health indicators.`;
                
                return {
                    feedback: {
                        priceEarningsRatio: peAnalysis,
                        earningsPerShare: epsAnalysis,
                        dividendYield: dividendAnalysis,
                        marketCap: marketCapAnalysis,
                        debtToEquityRatio: debtAnalysis,
                        returnOnEquity: roeAnalysis,
                        returnOnAssets: roaAnalysis,
                        currentRatio: currentRatioAnalysis,
                        quickRatio: quickRatioAnalysis,
                        bookValuePerShare: bookValueAnalysis
                    },
                    summary: summary,
                    recommendation: recommendation,
                    riskLevel: riskLevel,
                    confidenceScore: Math.round(confidenceScore)
                };
            }

            function getMetricIcon(metric) {
                const icons = {
                    priceEarningsRatio: 'chart-bar',
                    earningsPerShare: 'coins',
                    dividendYield: 'percentage',
                    marketCap: 'building',
                    debtToEquityRatio: 'balance-scale',
                    returnOnEquity: 'arrow-up',
                    returnOnAssets: 'arrow-up',
                    currentRatio: 'exchange-alt',
                    quickRatio: 'bolt',
                    bookValuePerShare: 'book'
                };
                return icons[metric] || 'chart-line';
            }

            function formatMetricName(metric) {
                return metric.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
            }

            function showMessage(message, type = 'info') {
                resultsDiv.innerHTML = `
                    <div class="bg-${type === 'success' ? 'green' : 'blue'}-50 border border-${type === 'success' ? 'green' : 'blue'}-200 rounded-lg p-4">
                        <div class="flex items-center text-${type === 'success' ? 'green' : 'blue'}-700">
                            <i class="fas fa-${type === 'success' ? 'check-circle' : 'info-circle'} mr-3"></i>
                            <span>${message}</span>
                        </div>
                    </div>
                `;
                resultsDiv.classList.remove('hidden');
            }

            // Initialize the application
            populateStockDropdown();
        });
    </script>
